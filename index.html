<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eval Run Viewer</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fff; color: #1a1a1a; line-height: 1.5; }

.file-bar { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 10px 24px; display: flex; gap: 10px; align-items: center; position: sticky; top: 0; z-index: 11; }
.file-bar label { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
.file-bar select { font-size: 13px; padding: 5px 8px; border: 1px solid #d0d0d0; border-radius: 4px; background: #fff; max-width: 500px; }

.header { background: #fafafa; border-bottom: 1px solid #e0e0e0; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; position: sticky; top: 37px; z-index: 10; }
.header-item { font-size: 13px; color: #555; }
.header-item strong { color: #1a1a1a; font-weight: 600; }
.header-item .mono { font-family: "SF Mono", "Fira Code", "Consolas", monospace; font-size: 12px; }
.status-ok { color: #16a34a; }
.status-err { color: #dc2626; }

.tabs { display: flex; border-bottom: 1px solid #e0e0e0; background: #fafafa; padding: 0 24px; position: sticky; top: 90px; z-index: 9; }
.tab { padding: 10px 20px; cursor: pointer; font-size: 14px; font-weight: 500; color: #666; border-bottom: 2px solid transparent; transition: all 0.15s; }
.tab:hover { color: #1a1a1a; }
.tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }

.panel { display: none; padding: 24px; max-width: 1200px; margin: 0 auto; }
.panel.active { display: block; }

/* Final output markdown */
.markdown-body { font-size: 15px; line-height: 1.7; }
.markdown-body h1 { font-size: 24px; margin: 24px 0 12px; padding-bottom: 8px; border-bottom: 1px solid #e0e0e0; }
.markdown-body h2 { font-size: 20px; margin: 20px 0 10px; }
.markdown-body h3 { font-size: 16px; margin: 16px 0 8px; }
.markdown-body p { margin: 8px 0; }
.markdown-body a { color: #2563eb; text-decoration: none; }
.markdown-body a:hover { text-decoration: underline; }
.markdown-body table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13px; }
.markdown-body th, .markdown-body td { border: 1px solid #d0d0d0; padding: 6px 10px; text-align: left; }
.markdown-body th { background: #f5f5f5; font-weight: 600; }
.markdown-body tr:nth-child(even) { background: #fafafa; }
.markdown-body strong { font-weight: 600; }
.markdown-body hr { border: none; border-top: 1px solid #e0e0e0; margin: 16px 0; }

/* Tool calls */
.tools-controls { display: flex; gap: 8px; margin-bottom: 16px; }
.tools-controls button { padding: 6px 14px; font-size: 13px; border: 1px solid #d0d0d0; border-radius: 4px; background: #fff; cursor: pointer; color: #555; }
.tools-controls button:hover { background: #f5f5f5; }

.tool-card { border: 1px solid #e0e0e0; border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
.tool-card-header { padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 13px; background: #fafafa; user-select: none; }
.tool-card-header:hover { background: #f0f0f0; }
.tool-card-header .arrow { font-size: 10px; color: #999; transition: transform 0.15s; width: 12px; flex-shrink: 0; }
.tool-card.open .arrow { transform: rotate(90deg); }
.tool-card-header .num { color: #999; font-family: monospace; min-width: 32px; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; font-family: monospace; color: #fff; }

.tool-status { font-size: 11px; font-weight: 600; margin-left: auto; flex-shrink: 0; }

.tool-summary { color: #666; font-family: monospace; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }

.tool-card-body { display: none; border-top: 1px solid #e0e0e0; }
.tool-card.open .tool-card-body { display: block; }

.tool-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
@media (max-width: 900px) { .tool-columns { grid-template-columns: 1fr; } }

.tool-col { padding: 12px; overflow: auto; }
.tool-col:first-child { border-right: 1px solid #e0e0e0; }
@media (max-width: 900px) { .tool-col:first-child { border-right: none; border-bottom: 1px solid #e0e0e0; } }
.tool-col-label { font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }

pre.json { font-family: "SF Mono", "Fira Code", "Consolas", monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; max-height: 500px; overflow: auto; background: #f8f8f8; padding: 10px; border-radius: 4px; }
pre.json .key { color: #0550ae; }
pre.json .str { color: #0a3069; }
pre.json .num { color: #0550ae; }
pre.json .bool { color: #cf222e; }
pre.json .null { color: #999; }

.rendered-md { max-height: 500px; overflow: auto; padding: 10px; background: #f8f8f8; border-radius: 4px; }
.rendered-md table { border-collapse: collapse; width: 100%; font-size: 12px; }
.rendered-md th, .rendered-md td { border: 1px solid #d0d0d0; padding: 4px 8px; text-align: left; }
.rendered-md th { background: #eee; }

/* Citations */
.citations { max-width: 1200px; margin: 0 auto; padding: 24px; }
.citations h3 { font-size: 14px; margin-bottom: 8px; color: #555; }
.citations-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.citation-item { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 4px; padding: 10px; font-size: 13px; }
.citation-item .label { color: #999; font-size: 11px; }
.citation-item .value { font-weight: 600; font-size: 18px; }

#loading { text-align: center; padding: 60px; color: #999; }
#error { padding: 80px 40px; display: none; text-align: center; }
#error .error-icon { font-size: 64px; margin-bottom: 16px; }
#error .error-title { font-size: 22px; font-weight: 700; color: #dc2626; margin-bottom: 8px; }
#error .error-detail { font-size: 14px; color: #555; margin-bottom: 20px; }
#error .error-path { font-family: "SF Mono", "Fira Code", "Consolas", monospace; font-size: 13px; background: #fef2f2; border: 1px solid #fecaca; padding: 10px 16px; border-radius: 6px; display: inline-block; color: #991b1b; }
</style>
</head>
<body>

<div class="file-bar">
  <label for="file-select">File</label>
  <select id="file-select" onchange="loadRun(this.value)"></select>
</div>
<div id="loading">Loading run data…</div>
<div id="error"></div>
<div id="app" style="display:none">
  <div class="header" id="header"></div>
  <div class="tabs">
    <div class="tab active" data-tab="output">Final Output</div>
    <div class="tab" data-tab="tools">Tool Calls <span id="tool-count"></span></div>
  </div>
  <div class="panel active" id="panel-output"></div>
  <div class="panel" id="panel-tools"></div>
  <div class="citations" id="citations-section"></div>
</div>

<script>
let currentFilename = new URLSearchParams(window.location.search).get('input') || CONFIG.defaultEvalFilename;

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

marked.setOptions({ breaks: false });
const renderer = new marked.Renderer();
renderer.html = () => '';
marked.use({ renderer });

const BADGE_COLORS = ['#7c3aed','#2563eb','#d97706','#059669','#dc2626','#0891b2','#c026d3','#ea580c'];
const badgeColorCache = {};
function badgeColor(toolName) {
  if (!badgeColorCache[toolName]) {
    let h = 0;
    for (let i = 0; i < toolName.length; i++) h = (h * 31 + toolName.charCodeAt(i)) | 0;
    badgeColorCache[toolName] = BADGE_COLORS[Math.abs(h) % BADGE_COLORS.length];
  }
  return badgeColorCache[toolName];
}

function fmtTime(seconds) {
  if (seconds == null) return '—';
  const m = Math.floor(seconds / 60);
  const s = Math.round(seconds % 60);
  return m > 0 ? `${m}m ${s}s` : `${s}s`;
}

function fmtNum(n) {
  return n != null ? n.toLocaleString() : '—';
}

function fmtCost(usage) {
  if (!usage) return '—';
  const cost = (usage.input_tokens / 1e6) * CONFIG.inputCostPerMillionTokens + (usage.output_tokens / 1e6) * CONFIG.outputCostPerMillionTokens;
  return cost.toFixed(2);
}

function syntaxHighlight(obj) {
  const raw = JSON.stringify(obj, null, 2);
  if (!raw) return '';
  const safe = esc(raw);
  return safe.replace(/(&quot;(?:(?!&quot;).)*&quot;)\s*:/g, '<span class="key">$1</span>:')
    .replace(/:\s*(&quot;(?:(?!&quot;).)*&quot;)/g, ': <span class="str">$1</span>')
    .replace(/:\s*(\d+\.?\d*)/g, ': <span class="num">$1</span>')
    .replace(/:\s*(true|false)/g, ': <span class="bool">$1</span>')
    .replace(/:\s*(null)/g, ': <span class="null">$1</span>');
}

function summarizeInput(args) {
  if (!args) return '';
  const entries = Object.entries(args);
  if (entries.length === 0) return '{}';
  const parts = entries.slice(0, 2).map(([k, v]) => {
    const val = typeof v === 'string' ? `"${v.length > 30 ? v.slice(0, 30) + '…' : v}"` :
                Array.isArray(v) ? `[${v.length}]` : JSON.stringify(v);
    return `${k}: ${val}`;
  });
  return '{' + parts.join(', ') + (entries.length > 2 ? ', …' : '') + '}';
}

function render(data) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.title = `Run: ${data.sample_id?.slice(0, 8)} t${data.trial}`;

  // Header
  const h = document.getElementById('header');
  const errHtml = data.error
    ? `<span class="status-err">✗ ${esc(typeof data.error === 'string' ? data.error : 'Error')}</span>`
    : '<span class="status-ok">✓ No errors</span>';
  h.innerHTML = `
    <div class="header-item"><strong>Sample</strong> <span class="mono">${esc(data.sample_id)}</span></div>
    <div class="header-item"><strong>Trial</strong> ${esc(data.trial)}</div>
    <div class="header-item"><strong>Time</strong> ${fmtTime(data.response_time)}</div>
    <div class="header-item"><strong>Tokens</strong> ${fmtNum(data.usage?.total_tokens)} (in: ${fmtNum(data.usage?.input_tokens)}, out: ${fmtNum(data.usage?.output_tokens)}) — <strong>$${fmtCost(data.usage)}</strong></div>
    <div class="header-item">${errHtml}</div>
    ${data.trace_id ? `<div class="header-item"><strong>Trace</strong> <span class="mono">${esc(data.trace_id)}</span></div>` : ''}
  `;

  // Final output
  document.getElementById('panel-output').innerHTML =
    '<div class="markdown-body">' + marked.parse(data.final_text || '') + '</div>';

  // Tool calls
  document.getElementById('tool-count').textContent = `(${data.tool_calls.length})`;
  const toolsPanel = document.getElementById('panel-tools');
  let toolsHtml = `<div class="tools-controls">
    <button onclick="toggleAll(true)">Expand all</button>
    <button onclick="toggleAll(false)">Collapse all</button>
  </div>`;

  data.tool_calls.forEach((tc, i) => {
    const status = tc.output?.status || '?';
    const statusCls = status === 'OK' ? 'status-ok' : 'status-err';
    const hasMd = tc.output?.result?.markdown;

    let bodyHtml;
    if (hasMd) {
      const outputWithoutMd = { ...tc.output, result: { ...tc.output.result } };
      const mdContent = outputWithoutMd.result.markdown;
      delete outputWithoutMd.result.markdown;

      bodyHtml = `
        <div class="tool-columns">
          <div class="tool-col">
            <div class="tool-col-label">Input Args</div>
            <pre class="json">${syntaxHighlight(tc.input_args)}</pre>
          </div>
          <div class="tool-col">
            <div class="tool-col-label">Output (other fields)</div>
            <pre class="json">${syntaxHighlight(outputWithoutMd)}</pre>
            <div class="tool-col-label" style="margin-top:10px">Output → result.markdown (rendered)</div>
            <div class="rendered-md">${marked.parse(mdContent)}</div>
          </div>
        </div>`;
    } else {
      bodyHtml = `
        <div class="tool-columns">
          <div class="tool-col">
            <div class="tool-col-label">Input Args</div>
            <pre class="json">${syntaxHighlight(tc.input_args)}</pre>
          </div>
          <div class="tool-col">
            <div class="tool-col-label">Output</div>
            <pre class="json">${syntaxHighlight(tc.output)}</pre>
          </div>
        </div>`;
    }

    toolsHtml += `
      <div class="tool-card">
        <div class="tool-card-header" onclick="this.parentElement.classList.toggle('open')">
          <span class="arrow">▶</span>
          <span class="num">#${i + 1}</span>
          <span class="badge" style="background:${badgeColor(tc.tool_name)}">${esc(tc.tool_name)}</span>
          <span class="tool-summary">${esc(summarizeInput(tc.input_args))} → ${esc(status)}</span>
          <span class="tool-status ${statusCls}">${esc(status)}</span>
        </div>
        <div class="tool-card-body">${bodyHtml}</div>
      </div>`;
  });

  toolsPanel.innerHTML = toolsHtml;

  // Citations
  const cs = document.getElementById('citations-section');
  if (data.citations) {
    cs.innerHTML = '<h3>Citations</h3><div class="citations-grid">' +
      Object.entries(data.citations).map(([k, v]) =>
        `<div class="citation-item"><div class="label">${esc(k.replace(/_/g, ' '))}</div><div class="value">${esc(v)}</div></div>`
      ).join('') + '</div>';
  }
}

function toggleAll(open) {
  document.querySelectorAll('.tool-card').forEach(c => {
    c.classList.toggle('open', open);
  });
}

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

function loadRun(filename) {
  currentFilename = filename;
  const url = new URL(window.location);
  url.searchParams.set('input', filename);
  history.replaceState(null, '', url);

  fetch('/api/run/' + encodeURIComponent(filename) + '?t=' + Date.now())
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(render)
    .catch(e => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'none';
      const el = document.getElementById('error');
      el.style.display = 'block';
      el.innerHTML = `
        <div class="error-icon">&#x26A0;</div>
        <div class="error-title">File not found</div>
        <div class="error-detail">Could not load the run file. Check that the path in <strong>config.js</strong> is correct.</div>
        <div class="error-path">${esc(CONFIG.evalOutputDir + filename)}</div>
      `;
    });
}

function ordinal(n) {
  if (n % 10 === 1 && n % 100 !== 11) return n + 'st';
  if (n % 10 === 2 && n % 100 !== 12) return n + 'nd';
  if (n % 10 === 3 && n % 100 !== 13) return n + 'rd';
  return n + 'th';
}

function runLabel(mtime) {
  const d = new Date(mtime * 1000);
  const month = d.toLocaleString('en-GB', { month: 'short' });
  let hours = d.getHours();
  const ampm = hours >= 12 ? 'pm' : 'am';
  hours = hours % 12 || 12;
  const minutes = String(d.getMinutes()).padStart(2, '0');
  return `${ordinal(d.getDate())} ${month} - ${hours}:${minutes}${ampm}`;
}

function refreshFileList() {
  fetch('/api/files?t=' + Date.now())
    .then(r => r.json())
    .then(files => {
      const select = document.getElementById('file-select');
      if (!files.some(f => f.name === currentFilename)) {
        files.unshift({ name: currentFilename, mtime: null });
      }
      const total = files.length;
      const optionsHtml = files.map((f, i) => {
        const label = f.mtime
          ? `Run ${total - i} (${runLabel(f.mtime)})`
          : f.name;
        return `<option value="${esc(f.name)}">${esc(label)}</option>`;
      }).join('');
      if (select.innerHTML !== optionsHtml) select.innerHTML = optionsHtml;
      select.value = currentFilename;
    })
    .catch(() => {});
}

refreshFileList();
setInterval(refreshFileList, 5000);
loadRun(currentFilename);
</script>
</body>
</html>
